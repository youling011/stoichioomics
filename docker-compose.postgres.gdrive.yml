services:
  postgres:
    image: postgres:16
    container_name: stoichioomics-postgres
    environment:
      POSTGRES_DB: stoichioomics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}
    ports:
      - '5432:5432'
    volumes:
      - G:/stoichioomics/项目平台数据/postgres_data/stoichioomics_pg16_rebuild_20260726_clean:/var/lib/postgresql/data
