version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: stoichioomics-postgres
    environment:
      POSTGRES_DB: stoichioomics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
