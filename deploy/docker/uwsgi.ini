[uwsgi]
strict = true
chdir = /opt/local/project
home = /opt/venv
py-executable = /opt/venv/bin/python
module = backend.config.wsgi:application
env = DJANGO_SETTINGS_MODULE=deploy.local_settings
env = DJANGO_ENV_FILE=
master = true
processes = 2
threads = 2
enable-threads = true
lazy-apps = true
single-interpreter = true
need-app = true
socket = /opt/local/run/uwsgi.sock
chmod-socket = 660
vacuum = true
die-on-term = true
close-on-exec = true
worker-reload-mercy = 120
skip-atexit-teardown = true
stats = /opt/local/run/uwsgi-stats.sock
# Existing background tasks are not durable across forced process termination.
