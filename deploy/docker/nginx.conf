user nginx nginx;
worker_processes 1;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    uwsgi_cache_path /var/cache/nginx/stoich_quality levels=1:2 keys_zone=stoich_quality:1m max_size=16m inactive=2h use_temp_path=off;
    include /etc/nginx/conf.d/*.conf;
}
